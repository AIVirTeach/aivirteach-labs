services:
  vm-manager:
    build:
      context: ../..
      dockerfile: vm-manager/guacamole/vm-manager.Dockerfile
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AIVIRTEACH_SESSION_TOKEN: "${AIVIRTEACH_SESSION_TOKEN:?Set AIVIRTEACH_SESSION_TOKEN}"
      AIVIRTEACH_GUACAMOLE_JSON_SECRET: "${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}"
      AIVIRTEACH_RDP_ALLOWED_CIDRS: "${AIVIRTEACH_RDP_ALLOWED_CIDRS:-192.168.122.0/24}"
      AIVIRTEACH_BROWSER_SESSION_TTL: "${AIVIRTEACH_BROWSER_SESSION_TTL:-60}"
      AIVIRTEACH_API_TOKEN: "5957e4240f0d9acf45473f1fb21e8ab2d0acb95b5375cb9d06ec3b0334e58372"
      AIVIRTEACH_AGENT_TOKEN: "5df6cff8240365de0c2e0cff9afa5ea3f73fa7382f6ffe3c39a9f67cdc520384"
      AIVIRTEACH_DIAGNOSTIC_TOKEN: "9cdf117d87bce82b34aef71ad7ddf297630987fcebf376f3d1d4f830aa5fbe82"
    ports:
      - "127.0.0.1:8760:8760"
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - /var/lib/aivirteach-labs:/var/lib/aivirteach-labs:ro

  guacd:
    image: "guacamole/guacd:${GUACAMOLE_VERSION:-1.6.0}"
    restart: unless-stopped
    networks:
      - guacamole

  guacamole:
    image: "guacamole/guacamole:${GUACAMOLE_VERSION:-1.6.0}"
    restart: unless-stopped
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: "${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}"
      REMOTE_IP_VALVE_ENABLED: "true"
      API_SESSION_TIMEOUT: "30"
    networks:
      - guacamole

  # Apache Guacamole's webapp sends no Access-Control-Allow-Origin header on
  # any response (confirmed empirically - a Tomcat CorsFilter added via
  # web.xml gets its headers wiped by Guacamole's Jersey/JAX-RS REST layer
  # on both success and error responses to /api/*, so that approach doesn't
  # work here). aivirteach-client's console-viewer.tsx calls
  # /guacamole/api/tokens directly from the browser, which is cross-origin
  # and therefore blocked without CORS headers. This proxy sits in front of
  # `guacamole` and adds them at the HTTP layer instead, independent of how
  # Guacamole's own webapp builds its responses. It publishes the port that
  # `guacamole` used to publish directly, so nothing pointing at
  # localhost:8080 (e.g. an existing cloudflared tunnel) needs to change.
  guacamole-cors-proxy:
    image: "nginx:1.27-alpine"
    restart: unless-stopped
    depends_on:
      - guacamole
    environment:
      AIVIRTEACH_GUACAMOLE_CORS_ORIGINS: "${AIVIRTEACH_GUACAMOLE_CORS_ORIGINS:?Set AIVIRTEACH_GUACAMOLE_CORS_ORIGINS}"
    volumes:
      - ./cors-proxy/docker-entrypoint.d/10-configure-cors.sh:/docker-entrypoint.d/10-configure-cors.sh:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - guacamole

networks:
  guacamole:
